[project]
name = "cala-context-efficiency"
version = "0.1.0"
description = "Experiment measuring research-agent context and cost efficiency with Cala"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cala-benchmark = "cala_benchmark.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cala_benchmark"]
