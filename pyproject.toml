[project]
name = "cala-context-efficiency"
version = "0.1.0"
description = "Cala vs web context-efficiency experiment using Inspect AI and BrowseComp"
requires-python = ">=3.11,<3.14"
dependencies = [
    "inspect-ai>=0.3.248",
    "inspect-evals>=0.16.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
